# macOS check on Codemagic (GitHub Actions is not available for this account): tests, plugin validation,
# and one real embedding on Apple's GPU (MPS) — the path a Mac takes instead of CUDA.
workflows:
  macos-check:
    name: memlab macOS check
    instance_type: mac_mini_m2
    max_build_duration: 30
    triggering:
      events: [push]
      branch_patterns:
        - pattern: main
    scripts:
      - name: Python 3.11 venv (uv)
        script: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          uv venv --python 3.11 .venv
          uv pip install --python .venv -e ".[test,research]"
      - name: Tests
        script: .venv/bin/python -m pytest -q tests
      - name: Plugin and mod validation
        script: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .
          claude plugin validate .claude-plugin/plugin.json
          claude plugin validate mods/memlab-root
      - name: Embedding on MPS
        script: |
          .venv/bin/python - <<'EOF'
          import torch
          from sentence_transformers import SentenceTransformer
          from memlab.embedder import device
          d = device(torch)
          print("device:", d)
          assert d == "mps", "Apple GPU not used"
          m = SentenceTransformer("intfloat/multilingual-e5-small", device=d)
          v = m.encode(["query: какой платёжный провайдер?", "passage: We charge orders through Stripe."])
          print("embedding shape:", v.shape)
          EOF
